[project]
name = "sprout-studio-mcp"
version = "1.1.0"
description = "Connect Sprout Studio to ChatGPT, Claude, Codex and Claude Code and any AI agent through Cotlet.dev, a hosted MCP server. No Sprout Studio API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["sprout studio", "sprout studio api", "sprout studio mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/sprout-studio-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=sprout-studio"
Source = "https://github.com/cotlet-connect/sprout-studio-mcp"

[project.scripts]
sprout-studio-mcp = "sprout_studio_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"sprout_studio_agent.py" = "sprout_studio_agent.py"

[tool.hatch.build.targets.sdist]
include = ["sprout_studio_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
